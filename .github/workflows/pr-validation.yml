name: PR Validation

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present || npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run || echo "No tests configured"
        
      - name: Build
        run: npm run build
        
      - name: Security audit
        run: npm audit --audit-level=high || echo "Vulnerabilities found, but allowing build to pass for now"
